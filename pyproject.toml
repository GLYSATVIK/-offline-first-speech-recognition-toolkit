[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "chunkasr"
dynamic = ["version"]
description = "Streaming, offline-first speech-recognition toolkit with NumPy/SciPy reference kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yuan Lin" }]
keywords = ["asr", "speech-recognition", "streaming", "ctc", "rnn-t", "signal-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0,<2.3",
    "scipy>=1.13,<1.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
mic = ["sounddevice>=0.4"]

[project.urls]
Homepage = "https://github.com/ringleadership/chunkasr"
Repository = "https://github.com/ringleadership/chunkasr"
Issues = "https://github.com/ringleadership/chunkasr/issues"

[project.scripts]
chunkasr = "chunkasr.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]

[tool.hatch.version]
path = "chunkasr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["chunkasr"]

[tool.hatch.build.targets.sdist]
include = ["chunkasr", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["chunkasr"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_equality = true
files = ["chunkasr"]

[[tool.mypy.overrides]]
module = ["scipy.*", "torch.*", "sounddevice.*", "yaml.*", "soundfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["chunkasr"]
omit = ["chunkasr/cli/mic.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:"]
